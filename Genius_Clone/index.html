<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Genius</title>
    <link rel="stylesheet" href="./src/css/global.css" />
  </head>
  <body>
    <main>
      <div class="container-game">
        <div class="table-game">
          <button id="green" disabled></button>
          <button id="red" disabled></button>
          <button id="blue" disabled></button>
          <button id="yellow" disabled></button>

          <span class="circle-mid"></span>
        </div>

        <button onclick="countdown()" class="button-init-game usable" id="button-init-game">Iniciar</button>
      </div>

      <div class="container-score-configs">
        <div class="container-score-button-configs">
          <div class="container-button">
            <button class="button-configs" id="button-configs"><img src="./src/assets/images/Gear_icon_black.svg" alt="Botão de configurações"></button>
          </div>

          <div class="container-score">
            <div>
              <p>Atual</p>
              <span id="current-score"></span>
            </div>
            <div>
              <p>Anterior</p>
              <span id="previous-score"></span>
            </div>
            <div>
              <p>Recorde</p>
              <span id="best-score"></span>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <ul>
        <li>
          <a
            rel="noreferrer"
            target="_blank"
            href="https://www.github.com/gut0Rodri"
            ><img src="./src/assets/images/Github_icon_lavender.svg" alt="Github"
          /></a>
        </li>
        <li>
          <a
            rel="noreferrer"
            target="_blank"
            href="https://www.linkedin.com/in/gutorodri"
            ><img src="./src/assets/images/Linkedin_icon_lavender.svg" alt="Linkedin"
          /></a>
        </li>
      </ul>

      <p>Desenvolvido por Carlos Rodrigues</p>
    </footer>
  </body>
  <script src="./src/javascript/index.js"></script>
</html>
