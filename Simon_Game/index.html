<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./src/assets/images/Icon.png">
    <title>Simon Game</title>
    <link rel="stylesheet" href="./src/css/global.css" />
  </head>
  <body>
    <main>
      <div>
        <div class="container-game">
          <div class="table-game">
            <button class="button-table-game" id="green"></button>
            <button class="button-table-game" id="red"></button>
            <button class="button-table-game" id="blue"></button>
            <button class="button-table-game" id="yellow"></button>

            <span class="circle-mid"></span>
          </div>

          <button
            onclick="countdown()"
            class="button-init-game usable"
            id="button-init-game"
          >
            Iniciar
          </button>
        </div>

        <aside class="container-score">
          <div class="score">
            <div>
              <p>Anterior</p>
              <span id="previous-score"></span>
            </div>
            
            <div>
              <p>Atual</p>
              <span id="current-score"></span>
            </div>
            
            <div>
              <p>Recorde</p>
              <span id="best-score"></span>
            </div>
          </div>
        </aside>
      </div>
    </main>

    <footer>
      <ul>
        <li>
          <a
            rel="noreferrer"
            target="_blank"
            href="https://www.github.com/gut0Rodri"
            ><img
              src="./src/assets/images/Github_icon_lavender.svg"
              alt="Github"
          /></a>
        </li>
        <li>
          <a
            rel="noreferrer"
            target="_blank"
            href="https://www.linkedin.com/in/gutorodri"
            ><img
              src="./src/assets/images/Linkedin_icon_lavender.svg"
              alt="Linkedin"
          /></a>
        </li>
      </ul>

      <p>Desenvolvido por Carlos Rodrigues</p>
    </footer>
  </body>
  <script src="./src/javascript/index.js"></script>
</html>
